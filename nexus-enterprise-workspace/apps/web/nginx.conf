server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Équivalent en production du proxy Vite (vite.config.ts) — sans lui,
    # le frontend statique n'aurait aucun moyen d'atteindre le backend.
    # "backend" = nom du service dans docker-compose.prod.yml.
    location ~ ^/(auth|organizations|data-sources|sync|data-batches|kobo|logical-frameworks|indicators|threads|ai|reports|dashboards|shared|billing|gdpr|audit-logs|health) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
